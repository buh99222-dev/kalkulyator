<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Расчёт настройки управленческого учёта</title>
<script>
// ЦЕНЫ И ПРАВИЛА: суммы в рублях, коэффициенты в долях (0.2 = 20%).
const PRICES = {
  complexity: { simple: 100000, medium: 200000, high: 400000 },
  business: { services: 0, trade: 0.2, production: 0.5 },
  product: { unf: 0, ka: 0.2 },
  extraCompanyRate: 0.2,
  custom: { none: 0, small: 50000, complex: 150000 },
  urgency: { normal: 0, fast: 0.2, urgent: 0.5 }
};
// Наценки за программу, тип бизнеса и компании считаются от базовой стоимости;
// срочность — от суммы всех предыдущих составляющих.
</script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19273b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:36px 20px 64px}h1{font-size:clamp(28px,5vw,44px);line-height:1.12;margin:12px 0}h2{margin:0 0 20px;font-size:21px}.intro{color:#617187;max-width:680px;line-height:1.6}.tag{color:#345ec7;font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.layout{display:grid;grid-template-columns:1fr 380px;gap:20px;margin-top:28px;align-items:start}.card{background:white;border:1px solid #e1e8f1;border-radius:20px;padding:26px;box-shadow:0 8px 28px #263c5910}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:14px;font-weight:650}select,input{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #ccd7e5;border-radius:10px;background:#fff;font:inherit;color:#19273b}select:focus,input:focus{outline:2px solid #7598ed;outline-offset:2px}.hint{font-size:13px;color:#738196;line-height:1.5;margin-top:8px}.line{display:flex;justify-content:space-between;gap:16px;padding:10px 0;color:#53647a;font-size:14px}.line span:last-child{white-space:nowrap;color:#19273b;font-weight:600}.total{border-top:1px solid #e1e8f1;margin-top:10px;padding-top:20px}.amount{font-size:32px;font-weight:800;margin:5px 0 12px;color:#234fb9}.note{font-size:13px;color:#718096;line-height:1.55}button{width:100%;border:0;border-radius:11px;background:#315fd0;color:white;padding:15px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}button:hover{background:#244eb8}button:focus-visible{outline:3px solid #8dabf2;outline-offset:3px}#status{min-height:20px;margin:9px 0 0;font-size:13px;color:#315f46}@media(max-width:760px){main{padding:25px 16px 40px}.layout{grid-template-columns:1fr}.card{padding:20px}.fields{grid-template-columns:1fr}}
.example{margin:6px 0 0;font-size:13px;font-weight:400;color:#526477;line-height:1.5}
.mobile-total{display:none}
@media(max-width:760px){main{padding-bottom:96px}.mobile-total{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:#203d81;color:white;text-decoration:none}.line{line-height:1.45}}
button:disabled{opacity:.5;cursor:default}
:root{background:#f7f5ee;color:#173e36;font-family:"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1180px;padding-top:32px}
h1{font-family:inherit;font-weight:650;letter-spacing:-.025em;font-size:clamp(34px,5.5vw,68px);max-width:1000px}
.tag{color:#326254}.intro{color:#456058}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{position:relative;display:grid;align-content:start;gap:10px;padding:22px;background:#fffdf7;border:1px solid #c3d1bd;border-radius:14px;cursor:pointer}
.plan input{position:absolute;top:17px;right:16px;width:18px;height:18px;margin:0;accent-color:#225d49}
.plan:has(:checked){background:#dceccf;border:2px solid #427252;padding:21px}
.plan strong{font-family:inherit;font-weight:600;font-size:clamp(24px,3vw,36px);font-variant-numeric:tabular-nums}.plan small{font-size:14px;font-weight:400;line-height:1.45;max-width:31ch}
.layout{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.card{box-shadow:none;border-color:#d8ddce}
#estimate{background:#153e35;color:#f6f5e9;border:none;position:sticky;top:16px}
#estimate h2{font-size:15px;font-weight:500;color:#c4d6cf}.amount{font-family:inherit;font-weight:650;font-size:clamp(34px,4vw,52px);font-variant-numeric:tabular-nums;color:white}
#estimate .line{border-top:1px solid #48685f;color:#e2e9df}#estimate .line span:last-child{color:white}
.total{border:none;padding:0}.note,#status{color:#d1ded4}button{background:#d6eeae;color:#163b2b}button:hover{background:#e7fac8}
@media(max-width:760px){.plans,.layout{grid-template-columns:1fr}.plans{gap:8px}.plan{gap:4px;padding:14px 40px 14px 16px}.plan:has(:checked){padding:13px 39px 13px 15px}.plan small{max-width:none}#estimate{position:static}.mobile-total{background:#153e35}}
.hero{background:#102f32;color:#fffcf2;border-radius:26px;display:grid;grid-template-columns:1.25fr 1fr;align-items:center;margin:0 0 30px;overflow:hidden}
.hero-copy{padding:32px clamp(22px,4vw,54px)}
.hero h1{font-size:clamp(33px,4.6vw,62px);line-height:1.02;margin:0}
.hero p{margin:22px 0 9px;color:#d6e4db}
.switch{display:inline-flex;padding:4px;gap:4px;border:1px solid #77968e;border-radius:12px}
.switch button{width:auto;margin:0;padding:9px 18px;color:#fff;background:transparent;border-radius:8px}
.switch button[aria-pressed=true]{background:#ffdb62;color:#25291f}
.diagram{position:relative;min-height:245px;isolation:isolate;background-image:radial-gradient(#5c82794f 1.5px,transparent 1.5px);background-size:15px 15px}
.chip,.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.chip{width:108px;height:94px;display:grid;place-items:center;background:linear-gradient(135deg,#fff1a1,#ffd048);border-radius:22px;box-shadow:0 8px 0 #ad861e,0 16px 28px #081e21;transition:transform .45s}
.chip svg{width:84%}.orbit{width:75%;height:70%;border:1px solid #689587;border-radius:50%;transform:translate(-50%,-50%) rotate(-21deg)}.inner{width:65%;height:50%;transform:translate(-50%,-50%) rotate(24deg)}
.node{position:absolute;padding:5px 13px;border-radius:20px;background:#203e41;color:#a9c1b9;border:1px solid #65857a;font-weight:650;transition:background .3s,color .3s}.node.unf{top:17%;left:14%}.node.ka{bottom:15%;right:13%}
.hero[data-product=unf] .unf,.hero[data-product=ka] .ka{background:#ffdb62;color:#25291f;border-color:#ffdb62}
.hero[data-product=ka] .chip{transform:translate(-50%,-50%) rotate(6deg)}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero-copy{padding:22px}.diagram{min-height:150px}.chip{width:80px;height:66px}.orbit{width:58%}.inner{width:48%}}
@media(prefers-reduced-motion:reduce){.node,.chip{transition:none}}
</style></head><body><main><header class="hero" id="hero" data-product="unf">
  <div class="hero-copy"><h1>Настройка управленческого учёта</h1>
  <p>Выберите программу для расчёта</p>
  <div class="switch" role="group" aria-label="Программа 1С">
    <button type="button" data-choice="unf" aria-pressed="true">1С:УНФ</button>
    <button type="button" data-choice="ka" aria-pressed="false">1С:КА</button>
  </div></div>
  <div class="diagram" aria-hidden="true">
    <div class="orbit"></div><div class="orbit inner"></div>
    <div class="chip"><svg viewBox="0 0 135 88" fill="none" aria-hidden="true">
      <g stroke="#cf2427" stroke-width="8"><path d="M8 18h30v55M8 30h18v43M116 18H86a28 28 0 0 0 0 56h30M116 30H86a16 16 0 0 0 0 32h30"/></g>
    </svg></div><span class="node unf">УНФ</span><span class="node ka">КА</span>
  </div>
</header><h2 id="scope">Какой объём настройки вам нужен?</h2><div class="plans" role="radiogroup" aria-labelledby="scope" id="plans"></div><div class="layout"><section class="card"><h2>Параметры проекта</h2><div class="fields">
<label>Программа<select id="product"><option value="unf">1С:УНФ</option><option value="ka">1С:КА</option></select></label>
<label hidden style="display:none">Сложность бизнеса<select id="complexity"><option value="simple">Простая</option><option value="medium">Средняя</option><option value="high">Высокая</option></select><p id="example" class="example"></p></label>
<label>Тип бизнеса<select id="business"><option value="services">Услуги</option><option value="trade">Торговля</option><option value="production">Производство</option></select></label>
<label>Количество компаний<input id="companies" type="number" min="1" step="1" value="1" inputmode="numeric"><div class="hint">Первая компания включена в базовую стоимость. Введите целое число от 1.</div></label>
<label>Индивидуальные решения<select id="custom"><option value="none">Не нужны</option><option value="small">Небольшие доработки</option><option value="complex">Сложные доработки</option></select><p class="example">Учитывайте только задачи, для которых нужно менять типовую программу. Например, разработать новый отчёт или обмен данными.</p></label>
<label>Сроки<select id="urgency"><option value="normal">Обычные</option><option value="fast">Ускоренно</option><option value="urgent">Срочно</option></select></label>
</div></section><aside class="card" id="estimate"><h2>Предварительная стоимость</h2><div class="amount" id="total" aria-live="polite"></div><div id="breakdown"></div><div class="total"><p class="note">Ориентировочная стоимость. Итоговая цена и сроки уточняются после обсуждения задач. <span id="ka-note"></span></p><button id="copy" type="button">Скопировать расчёт</button><p id="status" role="status" aria-live="polite"></p></div></aside></div></main><a class="mobile-total" href="#estimate"><span>Итого · к расчёту ↑</span><strong id="mobileAmount"></strong></a>
<script>
const ids=['product','complexity','business','companies','custom','urgency'];
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n);
 const examples = {
   simple: 'Например, настроить статьи доходов и расходов и типовой отчёт по прибыли.',
   medium: 'Например, разделить доходы и расходы по направлениям и настроить распределение общих затрат.',
   high: 'Например, связать бюджеты подразделений, распределение затрат и план-факт по проектам.'
 };
const plans = document.getElementById('plans');
for (const option of els.complexity.options) {
  const card = document.createElement('label');
  card.className = 'plan';
  card.innerHTML = `<input type="radio" name="scope" value="${option.value}"><span>${option.text} сложность</span><strong>${money(PRICES.complexity[option.value])}</strong><small>${examples[option.value]}</small>`;
  const radio = card.querySelector('input');
  radio.checked = option.selected;
  radio.addEventListener('change', () => {
    els.complexity.value = radio.value;
    update();
  });
  plans.append(card);
}
let copyText='';
const programButtons = document.querySelectorAll('[data-choice]');
for (const button of programButtons) {
  button.addEventListener('click', () => {
    els.product.value = button.dataset.choice;
    update();
  });
}
function update(){
 document.getElementById('hero').dataset.product = els.product.value;
 for (const button of programButtons) {
   button.setAttribute('aria-pressed', String(button.dataset.choice === els.product.value));
 }
 const percent = value => new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:2}).format(value);
 document.getElementById('ka-note').textContent = els.product.value === 'ka' ? 'Предварительная надбавка за 1С:КА — '+percent(PRICES.product.ka)+' от базы.' : '';
 const count = els.companies.valueAsNumber;
 const valid = Number.isSafeInteger(count) && count >= 1;
 els.companies.setAttribute('aria-invalid',String(!valid));
 document.getElementById('copy').disabled = !valid;
 if (!valid) {
   document.getElementById('breakdown').textContent='Введите целое количество компаний от 1.';
   document.getElementById('total').textContent='—';
   document.getElementById('mobileAmount').textContent='—';
   document.getElementById('status').textContent='';
   copyText='';
   return;
 }
 const base=PRICES.complexity[els.complexity.value], product=base*PRICES.product[els.product.value], business=base*PRICES.business[els.business.value], companies=base*PRICES.extraCompanyRate*(count-1), custom=PRICES.custom[els.custom.value];
 const subtotal=base+product+business+companies+custom, urgent=subtotal*PRICES.urgency[els.urgency.value], total=subtotal+urgent;
 const label = id => els[id].selectedOptions[0].text;
 const rows = [
   [label('complexity')+' сложность',base],
   [label('product')+' · '+percent(PRICES.product[els.product.value])+' × '+money(base),product],
   [label('business')+' · '+percent(PRICES.business[els.business.value])+' × '+money(base),business],
   ['Доп. компании · '+(count-1)+' × '+percent(PRICES.extraCompanyRate)+' × '+money(base),companies],
   ['Доработки · '+label('custom'),custom],
   ['Сроки · '+label('urgency')+' · '+percent(PRICES.urgency[els.urgency.value])+' × '+money(subtotal),urgent]
 ];
 document.getElementById('mobileAmount').textContent=money(total);
 document.getElementById('breakdown').innerHTML=rows.filter(([,value]) => value !== 0).map(([name,value])=>`<div class="line"><span>${name}</span><span>${money(value)}</span></div>`).join('');
 document.getElementById('total').textContent=money(total);
 const selected=id=>els[id].options[els[id].selectedIndex].text;
 copyText=['Расчёт настройки управленческого учёта',`Программа: ${selected('product')}`,`Сложность: ${selected('complexity')}`,`Тип бизнеса: ${selected('business')}`,`Количество компаний: ${count}`,`Индивидуальные решения: ${selected('custom')}`,`Сроки: ${selected('urgency')}`,'',...rows.map(([n,v])=>`${n}: ${money(v)}`),`Итого: ${money(total)}`,'Стоимость предварительная; итоговая цена и сроки уточняются после обсуждения.'].join('\n');
 document.getElementById('status').textContent='';
}
ids.forEach(id=>els[id].addEventListener('input',update));
document.getElementById('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(copyText)}else{const area=document.createElement('textarea');area.value=copyText;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw Error('copy')}document.getElementById('status').textContent='Расчёт скопирован.'}catch(e){document.getElementById('status').textContent='Не удалось скопировать автоматически. Попробуйте открыть файл в другом браузере.'}});
update();
</script></body></html>
